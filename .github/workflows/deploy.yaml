name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for rollback or manual deploy)"
        required: true
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, bcmath, intl, mbstring, zip
          coverage: none

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            {
              echo 'APP_NAME=Chirper'
              echo 'APP_ENV=testing'
              echo 'APP_KEY='
              echo 'APP_DEBUG=true'
              echo 'APP_URL=http://localhost'
              echo 'DB_CONNECTION=sqlite'
              echo 'DB_DATABASE=:memory:'
              echo 'CACHE_STORE=array'
              echo 'SESSION_DRIVER=array'
              echo 'QUEUE_CONNECTION=sync'
              echo 'MAIL_MAILER=array'
            } > .env
          fi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Run tests
        run: composer run test

      - name: Check formatting
        run: ./vendor/bin/pint --test

  build-and-push:
    needs: [test]
    if: github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_changed: ${{ steps.detect-changes.outputs.app_changed }}
      nginx_changed: ${{ steps.detect-changes.outputs.nginx_changed }}
      any_image_built: ${{ steps.detect-changes.outputs.any_image_built }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed deployment components
        id: detect-changes
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          APP_CHANGED=false
          NGINX_CHANGED=false

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            APP_CHANGED=true
            NGINX_CHANGED=true
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # BEFORE commit is not reachable (e.g., force-push) - rebuild everything
            APP_CHANGED=true
            NGINX_CHANGED=true
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER")"

            if [ -n "$CHANGED_FILES" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue

                case "$file" in
                  docs/*|README.md|*.md)
                    ;;
                  docker/nginx/*)
                    NGINX_CHANGED=true
                    ;;
                  public/*)
                    APP_CHANGED=true
                    NGINX_CHANGED=true
                    ;;
                  docker/app/*|app/*|bootstrap/*|config/*|database/*|resources/*|routes/*|composer.json|composer.lock|artisan|phpunit.xml)
                    APP_CHANGED=true
                    ;;
                  *)
                    # Safe fallback for uncategorized changes.
                    APP_CHANGED=true
                    NGINX_CHANGED=true
                    ;;
                esac
              done <<< "$CHANGED_FILES"
            fi
          fi

          ANY_IMAGE_BUILT=false
          if [ "$APP_CHANGED" = "true" ] || [ "$NGINX_CHANGED" = "true" ]; then
            ANY_IMAGE_BUILT=true
          fi

          echo "app_changed=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "nginx_changed=$NGINX_CHANGED" >> "$GITHUB_OUTPUT"
          echo "any_image_built=$ANY_IMAGE_BUILT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.detect-changes.outputs.any_image_built == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.detect-changes.outputs.any_image_built == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App image
        if: steps.detect-changes.outputs.app_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:latest

      - name: Build and push Nginx image
        if: steps.detect-changes.outputs.nginx_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:latest

      - name: Re-tag unchanged App image with current SHA
        if: steps.detect-changes.outputs.app_changed != 'true' && steps.detect-changes.outputs.nginx_changed == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker buildx imagetools create \
            --tag "${DOCKER_USERNAME}/chirper-app:${GITHUB_SHA}" \
            "${DOCKER_USERNAME}/chirper-app:latest"

      - name: Re-tag unchanged Nginx image with current SHA
        if: steps.detect-changes.outputs.app_changed == 'true' && steps.detect-changes.outputs.nginx_changed != 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker buildx imagetools create \
            --tag "${DOCKER_USERNAME}/chirper-nginx:${GITHUB_SHA}" \
            "${DOCKER_USERNAME}/chirper-nginx:latest"

      - name: Skip image build for docs-only changes
        if: steps.detect-changes.outputs.any_image_built != 'true'
        run: echo "No deployment image changes detected; skipping image build."

  deploy:
    needs: [build-and-push]
    if: |
      !failure() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.build-and-push.result == 'success' &&
          needs.build-and-push.outputs.any_image_built == 'true'
        )
      )
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve deploy image tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write production env file
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_PRODUCTION}" ]; then
            echo "ENV_PRODUCTION secret is required and must not be empty." >&2
            exit 1
          fi

          ( umask 177 && printf '%s\n' "$ENV_PRODUCTION" > "$GITHUB_WORKSPACE/.env.production" )

          required_env_keys=(APP_KEY APP_URL DB_DATABASE DB_USERNAME DB_PASSWORD)
          for key in "${required_env_keys[@]}"; do
            if ! grep -qE "^${key}=.+" "$GITHUB_WORKSPACE/.env.production"; then
              echo "Deploy failed: ${key} is missing from ENV_PRODUCTION secret"
              exit 1
            fi
          done

      - name: Deploy on self-hosted runner
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.value }}
        run: |
          set -euo pipefail

          on_error() {
            echo "Deployment failed. To rollback, rerun this workflow with workflow_dispatch and image_tag=<previous_sha>."
          }
          trap on_error ERR

          cleanup() {
            docker logout >/dev/null 2>&1 || true
            rm -f "${GITHUB_WORKSPACE}/.env.production"
          }
          trap cleanup EXIT

          cd "${GITHUB_WORKSPACE}"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Deploy failed: docker command is not available on this runner"
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Deploy failed: docker compose is not available on this runner"
            exit 1
          fi

          if [ ! -f compose.prod.yaml ]; then
            echo "Deploy failed: compose.prod.yaml not found in ${GITHUB_WORKSPACE}"
            exit 1
          fi

          if [ ! -f .env.production ]; then
            echo "Deploy failed: .env.production not found in ${GITHUB_WORKSPACE}"
            exit 1
          fi

          compose_prod() {
            docker compose --env-file .env.production -f compose.prod.yaml "$@"
          }

          # Ensure Compose uses workflow-provided image coordinates instead of file defaults.
          export DOCKER_USERNAME IMAGE_TAG

          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

          compose_prod pull app nginx
          compose_prod up -d pgsql

          DB_DATABASE="$(grep -E '^DB_DATABASE=' .env.production | head -n1 | cut -d'=' -f2- | tr -d '"')"
          DB_USERNAME="$(grep -E '^DB_USERNAME=' .env.production | head -n1 | cut -d'=' -f2- | tr -d '"')"
          DB_PASSWORD="$(grep -E '^DB_PASSWORD=' .env.production | head -n1 | cut -d'=' -f2- | tr -d '"')"

          if [ -z "$DB_DATABASE" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Deploy failed: DB_DATABASE, DB_USERNAME, or DB_PASSWORD is empty in .env.production"
            exit 1
          fi

          # Keep DB credentials in sync when pgsql data volume already exists.
          DB_PASSWORD_ESCAPED="$(printf '%s' "$DB_PASSWORD" | sed "s/'/''/g")"
          compose_prod exec -T pgsql psql \
            -v ON_ERROR_STOP=1 \
            -U "$DB_USERNAME" \
            -d "$DB_DATABASE" \
            -c "ALTER ROLE \"$DB_USERNAME\" WITH PASSWORD '$DB_PASSWORD_ESCAPED';"

          compose_prod up -d app
          compose_prod up -d nginx

          compose_prod exec -T app php artisan migrate:status --no-interaction
          compose_prod exec -T app php artisan migrate --pretend --no-interaction
          compose_prod exec -T app php artisan migrate --force --no-interaction

          # Smoke test: verify endpoint from APP_URL and force local resolution.
          # Tries HTTPS first; falls back to HTTP to support both TLS termination modes.
          APP_URL="$(grep -E '^APP_URL=' .env.production | head -n1 | cut -d'=' -f2- | tr -d '"')"
          if [ -z "$APP_URL" ]; then
            echo "Smoke test failed: APP_URL is not set in .env.production"
            exit 1
          fi

          APP_HOST="$(printf '%s' "$APP_URL" | sed -E 's#^https?://([^/]+).*$#\1#')"
          if [ -z "$APP_HOST" ]; then
            echo "Smoke test failed: cannot parse host from APP_URL=$APP_URL"
            exit 1
          fi

          echo "Smoke test target: https://$APP_HOST/"

          if ! command -v curl >/dev/null 2>&1; then
            echo "Smoke test failed: curl is required on the self-hosted runner"
            exit 1
          fi

          attempt=1
          max_attempts=10
          while [ "$attempt" -le "$max_attempts" ]; do
            if curl -fsS --connect-timeout 5 --max-time 15 --resolve "$APP_HOST:443:127.0.0.1" -o /dev/null "https://$APP_HOST/" || \
               curl -fsS --connect-timeout 5 --max-time 15 --resolve "$APP_HOST:80:127.0.0.1"  -o /dev/null "http://$APP_HOST/"; then
              echo "Smoke test passed on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Smoke test failed after $max_attempts attempts"
              echo "--- curl diagnostics ---"
              curl -v --connect-timeout 5 --max-time 15 --resolve "$APP_HOST:443:127.0.0.1" -o /dev/null "https://$APP_HOST/" 2>&1 || true
              curl -v --connect-timeout 5 --max-time 15 --resolve "$APP_HOST:80:127.0.0.1"  -o /dev/null "http://$APP_HOST/"  2>&1 || true
              echo "--- compose status ---"
              compose_prod ps
              compose_prod logs --tail=80 app nginx
              compose_prod exec -T app sh -lc 'tail -n 120 storage/logs/laravel.log || true'
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 3
          done

          compose_prod ps
          docker image prune -f