name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for rollback or manual deploy)"
        required: true
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:latest

  deploy:
    needs: [build-and-push]
    if: |
      !failure() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.build-and-push.result == 'success'
      )
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Resolve deploy image tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy on self-hosted runner
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.value }}
        run: |
          set -euo pipefail

          on_error() {
            echo "Deployment failed. To rollback, rerun this workflow with workflow_dispatch and image_tag=<previous_sha>."
          }
          trap on_error ERR

          cleanup() {
            docker logout >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cd ~/Chirper

          # Keep deploy assets in sync with the workflow run revision.
          git fetch --all --prune
          git checkout --force "${GITHUB_SHA}"

          # Ensure Compose uses workflow-provided image coordinates instead of file defaults.
          export DOCKER_USERNAME IMAGE_TAG

          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

          docker compose --env-file .env.production -f compose.prod.yaml pull app nginx
          docker compose --env-file .env.production -f compose.prod.yaml up -d pgsql
          docker compose --env-file .env.production -f compose.prod.yaml up -d app nginx

          docker compose --env-file .env.production -f compose.prod.yaml exec -T app php artisan migrate --force

          # Smoke test: verify HTTPS endpoint from APP_URL and force local resolution.
          APP_URL="$(grep -E '^APP_URL=' .env.production | head -n1 | cut -d'=' -f2- | tr -d '"')"
          if [ -z "$APP_URL" ]; then
            echo "Smoke test failed: APP_URL is not set in .env.production"
            exit 1
          fi

          APP_HOST="$(printf '%s' "$APP_URL" | sed -E 's#^https?://([^/]+).*$#\1#')"
          if [ -z "$APP_HOST" ]; then
            echo "Smoke test failed: cannot parse host from APP_URL=$APP_URL"
            exit 1
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "Smoke test failed: curl is required on the self-hosted runner"
            exit 1
          fi

          attempt=1
          max_attempts=10
          while [ "$attempt" -le "$max_attempts" ]; do
            if curl -fsS --resolve "$APP_HOST:443:127.0.0.1" -o /dev/null "https://$APP_HOST/"; then
              echo "Smoke test passed on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Smoke test failed after $max_attempts attempts"
              docker compose --env-file .env.production -f compose.prod.yaml ps
              docker compose --env-file .env.production -f compose.prod.yaml logs --tail=80 app nginx
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 3
          done

          docker compose --env-file .env.production -f compose.prod.yaml ps
          docker image prune -f