name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for rollback or manual deploy)"
        required: true
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:latest

  deploy:
    needs: [build-and-push]
    if: |
      !failure() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.build-and-push.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy image tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.value }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -euo pipefail

            on_error() {
              echo "Deployment failed. To rollback, rerun this workflow with workflow_dispatch and image_tag=<previous_sha>."
            }
            trap on_error ERR

            cd ~/Chirper

            docker compose --env-file .env.production -f compose.prod.yaml pull app nginx
            docker compose --env-file .env.production -f compose.prod.yaml up -d pgsql
            docker compose --env-file .env.production -f compose.prod.yaml up -d app nginx

            docker compose --env-file .env.production -f compose.prod.yaml exec -T app php artisan migrate --force

            # Smoke test: verify the homepage returns HTTP 200 after deployment.
            attempt=1
            max_attempts=10
            while [ "$attempt" -le "$max_attempts" ]; do
              if command -v curl >/dev/null 2>&1; then
                if curl -fsS -o /dev/null http://127.0.0.1/; then
                  echo "Smoke test passed on attempt $attempt"
                  break
                fi
              elif command -v wget >/dev/null 2>&1; then
                if wget -q -O /dev/null http://127.0.0.1/; then
                  echo "Smoke test passed on attempt $attempt"
                  break
                fi
              else
                echo "Smoke test failed: neither curl nor wget is available on VM"
                exit 1
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Smoke test failed after $max_attempts attempts"
                docker compose --env-file .env.production -f compose.prod.yaml ps
                docker compose --env-file .env.production -f compose.prod.yaml logs --tail=80 app nginx
                exit 1
              fi

              attempt=$((attempt + 1))
              sleep 3
            done

            docker compose --env-file .env.production -f compose.prod.yaml ps
            docker image prune -f