name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for rollback or manual deploy)"
        required: true
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yaml

  build-and-push:
    needs: [test]
    if: github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_changed: ${{ steps.detect-changes.outputs.app_changed }}
      nginx_changed: ${{ steps.detect-changes.outputs.nginx_changed }}
      any_image_built: ${{ steps.detect-changes.outputs.any_image_built }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed deployment components
        id: detect-changes
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          APP_CHANGED=false
          NGINX_CHANGED=false

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            APP_CHANGED=true
            NGINX_CHANGED=true
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # BEFORE commit is not reachable (e.g., force-push) - rebuild everything
            APP_CHANGED=true
            NGINX_CHANGED=true
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER")"

            if [ -n "$CHANGED_FILES" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue

                case "$file" in
                  docs/*|README.md|*.md)
                    ;;
                  .github/*)
                    ;;
                  docker/nginx/*)
                    NGINX_CHANGED=true
                    ;;
                  public/*)
                    APP_CHANGED=true
                    NGINX_CHANGED=true
                    ;;
                  docker/app/*|app/*|bootstrap/*|config/*|database/*|resources/*|routes/*|composer.json|composer.lock|artisan|phpunit.xml|package.json|package-lock.json|vite.config.js)
                    APP_CHANGED=true
                    ;;
                  *)
                    # Safe fallback for uncategorized changes.
                    APP_CHANGED=true
                    NGINX_CHANGED=true
                    ;;
                esac
              done <<< "$CHANGED_FILES"
            fi
          fi

          ANY_IMAGE_BUILT=false
          if [ "$APP_CHANGED" = "true" ] || [ "$NGINX_CHANGED" = "true" ]; then
            ANY_IMAGE_BUILT=true
          fi

          echo "app_changed=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "nginx_changed=$NGINX_CHANGED" >> "$GITHUB_OUTPUT"
          echo "any_image_built=$ANY_IMAGE_BUILT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.detect-changes.outputs.any_image_built == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.detect-changes.outputs.any_image_built == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App image
        if: steps.detect-changes.outputs.app_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:latest

      - name: Build and push Nginx image
        if: steps.detect-changes.outputs.nginx_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:latest

      - name: Re-tag unchanged App image with current SHA
        if: steps.detect-changes.outputs.app_changed != 'true' && steps.detect-changes.outputs.nginx_changed == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker buildx imagetools create \
            --tag "${DOCKER_USERNAME}/chirper-app:${GITHUB_SHA}" \
            "${DOCKER_USERNAME}/chirper-app:latest"

      - name: Re-tag unchanged Nginx image with current SHA
        if: steps.detect-changes.outputs.app_changed == 'true' && steps.detect-changes.outputs.nginx_changed != 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker buildx imagetools create \
            --tag "${DOCKER_USERNAME}/chirper-nginx:${GITHUB_SHA}" \
            "${DOCKER_USERNAME}/chirper-nginx:latest"

      - name: Skip image build for docs/workflow-only changes
        if: steps.detect-changes.outputs.any_image_built != 'true'
        run: echo "No deployment image changes detected (docs/workflow-only); skipping image build."

  deploy:
    needs: [build-and-push]
    if: |
      !failure() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.build-and-push.result == 'success' &&
          needs.build-and-push.outputs.any_image_built == 'true'
        )
      )
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve deploy image tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write production env file
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_PRODUCTION}" ]; then
            echo "ENV_PRODUCTION secret is required and must not be empty." >&2
            exit 1
          fi

          ( umask 177 && printf '%s\n' "$ENV_PRODUCTION" > "$GITHUB_WORKSPACE/.env.production" )

          required_env_keys=(APP_KEY APP_URL DB_DATABASE DB_USERNAME DB_PASSWORD)
          for key in "${required_env_keys[@]}"; do
            if ! grep -qE "^${key}=.+" "$GITHUB_WORKSPACE/.env.production"; then
              echo "Deploy failed: ${key} is missing from ENV_PRODUCTION secret"
              exit 1
            fi
          done

      - name: Deploy on self-hosted runner (auto-fix + one retry)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.value }}
        run: |
          set -euo pipefail

          if bash .github/scripts/deploy-prod.sh; then
            echo "Deployment succeeded on first attempt."
            exit 0
          fi

          echo "Deployment attempt 1 failed. Running self-heal and retrying once..."
          bash .github/scripts/deploy-self-heal.sh || true

          if bash .github/scripts/deploy-prod.sh; then
            echo "Deployment succeeded on retry attempt."
            exit 0
          fi

          echo "Deployment failed after self-heal retry. To rollback, rerun this workflow with workflow_dispatch and image_tag=<previous_sha>."
          exit 1

      - name: Cleanup deployment artifacts
        if: always()
        run: |
          docker logout >/dev/null 2>&1 || true
          rm -f "${GITHUB_WORKSPACE}/.env.production"
