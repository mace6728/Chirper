name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for rollback or manual deploy)"
        required: true
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/chirper-nginx:latest

  deploy:
    needs: [build-and-push]
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.build-and-push.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy image tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.value }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/Chirper

            docker compose -f compose.prod.yaml pull app nginx
            docker compose -f compose.prod.yaml up -d pgsql
            docker compose -f compose.prod.yaml up -d app nginx

            docker compose -f compose.prod.yaml exec -T app php artisan migrate --force

            docker compose -f compose.prod.yaml ps
            docker image prune -f