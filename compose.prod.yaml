services:
    app:
        image: '${DOCKER_USERNAME}/chirper-app:${IMAGE_TAG:-latest}'
        restart: unless-stopped
        env_file:
            - .env.production
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
        healthcheck:
            test: 'php -r ''$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);'''
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: '${DOCKER_USERNAME}/chirper-nginx:${IMAGE_TAG:-latest}'
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - '/etc/letsencrypt:/etc/ssl/letsencrypt:ro'
        networks:
            - sail
        depends_on:
            app:
                condition: service_healthy

    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'psql -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1" > /dev/null 2>&1']
            interval: 5s
            retries: 10
            timeout: 5s
            start_period: 10s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
