server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sdc-cloud.me sdc-cloud.me;

    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 20M;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    ssl_certificate /etc/ssl/letsencrypt/live/www.sdc-cloud.me/fullchain.pem;
    ssl_certificate_key /etc/ssl/letsencrypt/live/www.sdc-cloud.me/privkey.pem;

    # Gzip compression for common text-based assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sdc-cloud.me sdc-cloud.me;

    return 301 https://$host$request_uri;
}
